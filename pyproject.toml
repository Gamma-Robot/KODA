[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "koda-pipeline"
version = "0.1.0"
description = "KODA: kinematics-observation data alignment for humanoid learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<2.2", "pyyaml>=6.0", "platformdirs>=4.2", "huggingface-hub>=0.27", "requests>=2.32"]

[project.optional-dependencies]
cuda = ["torch>=2.5,<2.8", "torchvision>=0.20,<0.23", "mujoco==3.5.0", "mujoco-mjx==3.5.0", "mujoco-warp==3.5.0.2", "warp-lang==1.12.0", "opencv-python-headless>=4.10", "pycocotools>=2.0.7", "imageio-ffmpeg>=0.5", "h5py>=3.10", "mcap>=1.1", "mcap-ros2-support>=0.5", "rerun-sdk>=0.22", "tqdm>=4.65", "scipy>=1.10", "scikit-learn>=1.4", "pyransac3d>=0.6", "pyarrow>=15", "onnx==1.22.0", "onnxruntime-gpu==1.23.2", "jax[cuda12]>=0.4.30,<0.6", "jaxlib>=0.4.30,<0.6", "hydra-core>=1.3", "omegaconf>=2.3", "filelock>=3.15", "psutil>=6.0", "timm>=1.0.17", "ftfy==6.1.1", "regex>=2024.0", "iopath>=0.1.10", "diffusers==0.29.2", "accelerate>=0.25", "transformers==4.41.1", "einops>=0.8", "peft==0.13.2", "av>=14", "pillow>=10", "scikit-image>=0.24", "trimesh>=4.0", "bvhio>=1.0", "matplotlib>=3.8", "pin>=4.1,<4.2; sys_platform == 'linux'", "mink==0.0.13", "nlopt>=2.7", "pytransform3d>=3.5", "anytree>=2.12", "lxml>=5.0", "addict>=2.4", "yapf>=0.40", "boto3>=1.35", "scenepic>=1.0", "safetensors>=0.4", "datasets>=2.20", "e3nn>=0.5", "evo>=1.29", "plyfile>=1.0", "pillow-heif>=0.16", "pycolmap>=3.10", "pypose>=0.7", "pandas>=2.1", "numba>=0.59", "fastapi>=0.110", "uvicorn>=0.29", "typer>=0.12", "moviepy>=1.0", "ultralytics>=8.3", "smplx==0.1.28", "yacs>=0.1.8", "pytorch-lightning>=2.4,<3", "chumpy @ git+https://github.com/mattloper/chumpy"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
koda = "koda.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koda"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
