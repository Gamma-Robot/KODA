    - left_ring_proximal_joint
    - left_pinky_proximal_joint
  target_link_human_indices_position: [0, 1, 2, 3, 4]
  target_link_names:
    - left_thumb_tip_Link
    - left_index_tip_Link
    - left_middle_tip_Link
    - left_ring_tip_Link
    - left_pinky_tip_Link
