# Isolated Dex3 *position* retargeting config for offline ablation.
# Does not replace xr_teleoperate/assets/unitree_hand/unitree_dex3.yml.
#
# Uses absolute 3D link positions (wrist + three fingertips) with a 6-DoF
# dummy free joint so the optimizer can absorb SE(3) while finger joints
# match tip geometry.  Human indices assume the AVP-25 layout produced by
# koda.retargeting.dex3 (_mano21_to_avp25):
#   0=wrist, 4=thumb tip, 9=index tip, 14=middle tip.

left:
  type: position
  urdf_path: unitree_hand/unitree_dex3_left.urdf
  add_dummy_free_joint: true
  target_joint_names:
    [
      "left_hand_thumb_0_joint",
      "left_hand_thumb_1_joint",
      "left_hand_thumb_2_joint",
      "left_hand_middle_0_joint",
      "left_hand_middle_1_joint",
      "left_hand_index_0_joint",
      "left_hand_index_1_joint",
    ]
  target_link_names: ["base_link", "thumb_tip", "index_tip", "middle_tip"]
  target_link_human_indices_position: [0, 4, 9, 14]
  # PositionOptimizer ignores scaling_factor; koda.retargeting.dex3 scales
  # wrist-centered offsets when --scaling-factor is passed.
  scaling_factor: 1.0
  low_pass_alpha: 0.2
  normal_delta: 4.0e-3
  huber_delta: 2.0e-2

right:
  type: position
  urdf_path: unitree_hand/unitree_dex3_right.urdf
  add_dummy_free_joint: true
  target_joint_names:
    [
      "right_hand_thumb_0_joint",
      "right_hand_thumb_1_joint",
      "right_hand_thumb_2_joint",
      "right_hand_index_0_joint",
      "right_hand_index_1_joint",
      "right_hand_middle_0_joint",
      "right_hand_middle_1_joint",
    ]
  target_link_names: ["base_link", "thumb_tip", "index_tip", "middle_tip"]
  target_link_human_indices_position: [0, 4, 9, 14]
  scaling_factor: 1.0
  low_pass_alpha: 0.2
  normal_delta: 4.0e-3
  huber_delta: 2.0e-2
