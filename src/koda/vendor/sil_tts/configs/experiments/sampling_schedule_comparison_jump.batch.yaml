    ref: planners/predictive_sampling.yaml
    overrides: {noise_level: 0.2}
  - id: weighted_elites
    ref: planners/weighted_elites.yaml
    overrides: {noise_scale: 0.2}
  - id: spider
    ref: planners/spider.yaml
    overrides: {noise_scale: 0.2, exploit_fraction: 0.02}
