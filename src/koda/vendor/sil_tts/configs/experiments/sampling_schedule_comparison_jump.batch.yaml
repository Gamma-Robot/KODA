schema_version: 2
# Stage 11 pre-run claim rule, locked in this source commit:
# A planner passes iff all its 18 cells across this manifest and the paired
# walk manifest succeed without invariant failures or all-penalty updates;
# the pooled median optimized-minus-baseline body_position_mean_error_m is
# negative; and at least 4/6 tracker-motion groups have a negative three-seed
# median with at least 2/3 improving seeds. The bounded schedule-robustness
# conclusion requires all three planners to pass. This is not an equal-
# physical-compute, efficiency, statistical-significance, global optimizer-
# independence, or predictive-sampling/SPIDER iteration-scaling claim.
name: sampling_schedule_comparison_jump
experiment_refs:
  - experiments/wxy_jump_full.yaml
  - experiments/heft_jump_full.yaml
  - experiments/sonic_jump_full.yaml
clip_duration_seconds: 10.0
