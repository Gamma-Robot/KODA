# Frozen shared configuration selected 2026-08-12: H40/E20/N80/I4, K=640.
# H100 full-matrix cost: 0.429903. Known timing caveat: two s1/r07
# cells measured 5.439193x (SONIC) and 5.301953x (TWIST2), above the 5x gate.
schema_version: 3

robot:
  ref: robots/g1_mjwarp.yaml

planner:
  ref: planners/cem.yaml
  num_candidates: 80
  num_iterations: 4
  num_elites: 9
  sigma_start: 1.6
  sigma_min: 0.075
  explore_fraction: 0.0

motion_tracking:
  ref: motion_tracking/default.yaml

target:
  manifest_artifact: amass-s2-v1
  motion_artifact: amass-s2-v1

planning:
  horizon_steps: 40
  execution_chunk_steps: 20
  num_knots: 5
  max_worlds: 80
  failure_penalty: 1000000000000.0
  seed: 47
  evaluate_proposal: false
  root_body_name: pelvis
  interpolation_method: linear
  right_tail: zero
  warm_start_mode: reset
  scales:
    root_xy_m: 0.055
    root_z_m: 0.0275
    root_rotation_rad: 0.0825
    joint_position_rad: 0.1375

visualization:
  enabled: false
  fps: 25
  width: 640
  height: 360
  distance: 4.0
  azimuth: 135.0
  elevation: -18.0
  nominal_lookat_height: 0.9
  camera_mode: follow
  show_root_error: true
  show_time: true
