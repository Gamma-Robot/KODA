[project]
name = "sil-trackers"
version = "0.1.0"
description = "Pretrained-tracker integration and inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime-gpu==1.23.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
scalebfm = ["torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sil_trackers"]
