[project]
name = "sil-tts"
version = "0.1.0"
description = "Simulation-in-the-loop test-time scaling application"
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.7.0",
    "mujoco-warp==3.5.0.2",
    "numpy>=1.26",
    "onnx==1.22.0",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    "sil-planners",
    "sil-trackers",
    "warp-lang==1.12.0",
]

[project.optional-dependencies]
groot = ["pyarrow>=15"]
scalebfm = ["torch"]

[project.scripts]
sil-tts = "sil_tts.run_sil:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sil_tts"]
